# Pretrained emulators that every toolkit change must keep working: each one
# must still load, verify its published fingerprint, and predict what it
# predicted under the toolkit version that wrote it. See README.md here.
#
# Pin `revision` to a commit (a tag or branch can move). `label` names the
# reference file. `written_by_toolkit` is the bundle's provenance
# toolkit_version, and is the version to record its reference with.
# Optional per entry: rtol, atol, n_points, n_axis, allow_legacy_warning, notes.

